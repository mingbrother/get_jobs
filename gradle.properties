# Gradle JVM options: prefer IPv4 to avoid Windows proxy/TUN socket timeouts.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# Proxy configuration disabled for CI builds.
# Uncomment and configure for local development if needed:
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7897
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7897
# systemProp.http.nonProxyHosts=localhost|127.*|[::1]
